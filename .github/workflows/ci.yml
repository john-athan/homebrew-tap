name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to keep CI snappy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-audit:
    name: validate
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      # tools/validate.sh runs brew style and brew audit. `brew audit` refuses
      # file-path arguments and needs the repo to be a registered tap, so link
      # this checkout in as john-athan/homebrew-tap. CI is set on the runner,
      # which is what makes the script audit.
      - name: Register checkout as a tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/john-athan/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          rm -rf "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Validate
        run: tools/validate.sh
